<div class="hb-card hb-card-{scheme}">
    [<img class="hb-card-cover" src="{cover}" alt="" width="{cover|width}" height="{cover|height}" {loading}>]
    <div class="hb-card-content">
        [<img class="hb-card-logo" src="{logo|small}" alt="">]
        [<span class="hb-card-type">{eyebrow}</span>]
        [<div class="hb-card-title">{title}</div>]
        [<p class="hb-card-text">{text}</p>]
        [<p class="hb-card-notice">{notice}</p>]
    </div>
    [<a class="hb-card-link" href="{link}" tabindex="-1" aria-hidden="true"></a>]
    [<div class="hb-card-chips">{chips}</div>]
</div>
