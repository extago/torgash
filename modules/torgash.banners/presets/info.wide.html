<div class="hb-info hb-info-{tone} {glow}" style="--glow: {glow_colour}">
    [<img class="hb-info-logo" src="{logo|small}" alt="">]
    [<span class="hb-info-icon">{icon}</span>]
    [<div class="hb-info-title">{title}</div>]
    [<p class="hb-info-text">{text}</p>]
    [<a class="hb-info-button btn btn-sm" href="{link}">{button}</a>]
    [<a class="hb-info-link" href="{link}" tabindex="-1" aria-hidden="true"></a>]
</div>
