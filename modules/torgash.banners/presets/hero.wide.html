<div class="hb-hero hb-hero-{scheme} hb-fit-{fit} {dim}" style="--slide-bg: {background}">
    [<video class="hb-hero-video" src="{video}" muted loop playsinline preload="none" data-autoplay aria-hidden="true"></video>]
    [<picture class="hb-hero-picture"><source media="(max-width: 767px)" srcset="{image_phone}"><img src="{image}" alt="" width="{image|width}" height="{image|height}" {loading}></picture>]
    <div class="hb-hero-content">
        [<span class="hb-hero-eyebrow">{eyebrow}</span>]
        [<div class="hb-hero-title">{title}</div>]
        [<p class="hb-hero-text">{text}</p>]
        [<p class="hb-hero-notice">{notice}</p>]
        [<a class="hb-hero-button btn btn-lg" href="{link}">{button}</a>]
    </div>
    [<a class="hb-hero-link" href="{link}" tabindex="-1" aria-hidden="true"></a>]
</div>
